<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="description" content="Geomapping with D3">
    <meta name="keywords" content="HTML, CSS, D3, GeoJSON, CSV">
    <meta name="author" content="Ivan">
    <title>Lab 8.2 D3 Choropleths</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
        }
        .lga-boundary {
            stroke: #fff;
            stroke-width: 0.5;
        }
        .legend {
            font-size: 12px;
        }
        .city-label {
            font-size: 10px;
            fill: black;
            text-anchor: middle;
        }
        /* Tooltip styling */
        .tooltip {
            position: absolute;
            text-align: center;
            padding: 5px;
            font-size: 12px;
            background: lightsteelblue;
            border: 1px solid #333;
            border-radius: 5px;
            pointer-events: none; /* Prevents flickering */
            opacity: 0; /* Initially invisible */
        }
    </style>
</head>
<body>
    <h1>Victorian Number Unemployed by LGA</h1>

    <!-- SVG container for the map -->
    <svg id="map" width="600" height="600"></svg>

    <!-- Tooltip container -->
    <div id="tooltip" class="tooltip"></div>

    <!-- Optional: Add a legend -->
    <div id="legend" class="legend"></div>

    <script src="Lab8.2.js"></script>
</body>
</html>
