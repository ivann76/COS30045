<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="description" content="Geomapping with D3">
    <meta name="keywords" content="HTML, CSS, D3, GeoJSON, CSV">
    <meta name="author" content="Ivan">
    <title>Victoria LGAs Unemployment Choropleth</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
        }
        .lga-boundary {
            stroke: #fff;
            stroke-width: 0.5;
        }
        .city {
            fill: red;
        }
        .legend {
            font-size: 12px;
        }
    </style>
</head>
<body>
    <h1>Victoria Local Government Areas (LGA) Unemployment Choropleth</h1>
    <svg id="map" width="600" height="600"></svg>

    <script>
        // Define the dimensions of the SVG
        const width = 600;
        const height = 600;

        // Create an SVG container
        const svg = d3.select("#map")
            .attr("width", width)
            .attr("height", height);

        // Define a projection (Mercator) and center it on Victoria, Australia
        const projection = d3.geoMercator()
            .center([145, -37])  // Center on Victoria (longitude, latitude)
            .translate([width / 2, height / 2])  // Center the map within the SVG
            .scale(3000);  // Scale for zoom

        // Define a path generator using the projection
        const path = d3.geoPath().projection(projection);

        // Define a color scale for the choropleth (using ColorBrewer)
        const color = d3.scaleQuantize()
            .range(d3.schemeBlues[9]);  // Blues color scheme with 9 shades

        // Load the unemployment data and the GeoJSON simultaneously
        d3.csv("vic_LGA_unemployment.csv").then(function(unemploymentData) {
            d3.json("LGA_VIC.json").then(function(json) {

                // Merge unemployment data into GeoJSON
                unemploymentData.forEach(function(d) {
                    const LGAName = d.LGA_name;
                    const unemploymentRate = +d.unemployment_rate;

                    // Find the matching LGA in the GeoJSON
                    json.features.forEach(function(feature) {
                        if (feature.properties.LGA_name === LGAName) {
                            feature.properties.unemployment_rate = unemploymentRate;
                        }
                    });
                });

                // Set the domain of the color scale based on the unemployment rates
                color.domain([0, d3.max(unemploymentData, d => +d.unemployment_rate)]);

                // Draw the map and color the LGAs based on unemployment rate
                svg.selectAll("path")
                    .data(json.features)
                    .enter()
                    .append("path")
                    .attr("class", "lga-boundary")
                    .attr("d", path)
                    .style("fill", d => {
                        const rate = d.properties.unemployment_rate;
                        return rate ? color(rate) : "#ccc";  // Fill missing data with gray
                    });

                // Add a legend for the color scale
                const legend = svg.append("g")
                    .attr("class", "legend")
                    .attr("transform", "translate(20,20)");

                const legendScale = d3.scaleLinear()
                    .domain(color.domain())
                    .range([0, 200]);

                const legendAxis = d3.axisBottom(legendScale)
                    .ticks(6);

                legend.selectAll("rect")
                    .data(color.range().map(d => color.invertExtent(d)))
                    .enter().append("rect")
                    .attr("x", d => legendScale(d[0]))
                    .attr("y", 0)
                    .attr("width", d => legendScale(d[1]) - legendScale(d[0]))
                    .attr("height", 10)
                    .style("fill", d => color(d[0]));

                legend.append("g")
                    .attr("transform", "translate(0,10)")
                    .call(legendAxis);

                // Load the cities data and add small circles to indicate towns/cities
                d3.csv("VIC_city.csv").then(function(cityData) {
                    svg.selectAll("circle")
                        .data(cityData)
                        .enter()
                        .append("circle")
                        .attr("class", "city")
                        .attr("cx", d => projection([+d.longitude, +d.latitude])[0])
                        .attr("cy", d => projection([+d.longitude, +d.latitude])[1])
                        .attr("r", 3)
                        .style("fill", "red");

                    // Add labels for the cities
                    svg.selectAll("text")
                        .data(cityData)
                        .enter()
                        .append("text")
                        .attr("x", d => projection([+d.longitude, +d.latitude])[0] + 5)
                        .attr("y", d => projection([+d.longitude, +d.latitude])[1])
                        .text(d => d.city)
                        .attr("font-size", "10px")
                        .attr("fill", "black");
                });
            });
        }).catch(function(error) {
            console.log("Error loading the data:", error);
        });
    </script>
</body>
</html>
