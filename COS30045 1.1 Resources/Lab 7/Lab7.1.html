<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="description" content="Data Visualisation">
    <meta name="keywords" content="HTML, CSS, D3">
    <meta name="author" content="Ivan">
    <title>Lab 7.1 D3 Line and Area Charts</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
        }
        .line {
            fill: none;
            stroke: steelblue;
            stroke-width: 2;
        }
        .area {
            fill: lightsteelblue;
        }
        .hero {
            text-align: center;
            padding: 100px 20px;
            background-color: #FBFBFE;
            position: relative;
        }

        .hero h1 {
            font-size: 3em;
            line-height: 1.2;
            color: #333;
        }

        .hero p {
            margin-top: 10px;
            font-size: 1.2em;
            color: #555;
        }

    </style>
</head>
<body>
    <section class="hero" style="background-color: rgb(212, 233, 250);">
        <h1>Number of Unemployed in Australia</h1>
        <div id="chart"></div>
    <section class="hero" style="background-color: rgb(212, 233, 250);"></section>

    <script src="Lab7.1.js"></script>
</body>
</html>
