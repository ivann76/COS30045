<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="description" content="Data Visualisation">
    <meta name="keywords" content="HTML, CSS, D3">
    <meta name="author" content="Ivan">
    <title>D3 Stacked Bar Chart</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
        }
        .bar rect {
            stroke: #fff;
        }
        .legend {
            font-size: 12px;
            font-family: Arial, sans-serif;
        }
        .legend rect {
            stroke-width: 2;
            stroke: white;
        }
    </style>
</head>
<body>
    <h1>D3 Stacked Bar Chart</h1>
    <svg id="chart" width="300" height="300"></svg>
      <!-- SVG container for the legend -->
      <svg id="legend" width="300" height="50"></svg>
    <script src="Lab7.3.js"></script>
</body>
</html>
