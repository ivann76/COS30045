<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="description" content="Data Visualisation">
    <meta name="keywords" content="HTML, CSS, D3">
    <meta name="author" content="Ivan">
    <title>LAB 7.2 D3 Pie Chart</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
        }
        .arc path {
            stroke: #fff;
        }
    </style>
</head>
<body>
    <h1>Number of Unemployed in Australia</h1>
    <svg id="chart" width="300" height="300"></svg>
    <script>
        // Define the dimensions of the SVG
        const width = 300;
        const height = 300;
        const radius = Math.min(width, height) / 2;

        // Create a color scale
        const color = d3.scaleOrdinal(d3.schemeCategory10);

        // Define the data
        const data = [10, 20, 30, 40, 50];

        // Create the pie generator
        const pie = d3.pie();

        // Create the arc generator
        const arc = d3.arc()
            .outerRadius(radius - 10)
            .innerRadius(0);  // Set to greater than 0 for donut chart

        // Create an SVG container
        const svg = d3.select("#chart")
            .attr("width", width)
            .attr("height", height)
            .append("g")
            .attr("transform", `translate(${width / 2}, ${height / 2})`);

        // Bind the data and create one path per pie slice
        const g = svg.selectAll(".arc")
            .data(pie(data))
            .enter().append("g")
            .attr("class", "arc");

        g.append("path")
            .attr("d", arc)
            .style("fill", (d, i) => color(i));

        // Add text labels to the slices
        g.append("text")
            .attr("transform", d => `translate(${arc.centroid(d)})`)
            .attr("dy", ".35em")
            .text(d => d.data);

    </script>
</body>
</html>
